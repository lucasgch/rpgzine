name: Deploy RPGZine to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install JBake
        run: |
          curl -sL https://github.com/jbake-org/jbake/releases/download/v2.7.0/jbake-2.7.0-bin.zip -o jbake.zip
          unzip -q jbake.zip
          chmod +x jbake-2.7.0-bin/bin/jbake
          echo "$PWD/jbake-2.7.0-bin/bin" >> $GITHUB_PATH

      - name: Cache WebP images
        id: cache-webp
        uses: actions/cache@v4
        with:
          path: assets/img-webp
          key: webp-v3-${{ hashFiles('assets/img/**') }}

      - name: Convert images to WebP
        if: steps.cache-webp.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y webp imagemagick

          # Responsive breakpoints to generate (px widths).
          WIDTHS="800 1200"
          # Files excluded from conversion (OG image — crawler compatibility).
          EXCLUDE_NAMES="imagem-padrao.png"

          convert_one() {
            img="$1"
            rel="${img#assets/img/}"
            base="${rel%.*}"

            for ex in $EXCLUDE_NAMES; do
              if [ "$(basename "$img")" = "$ex" ]; then
                echo "Skipped (excluded): $img"
                return
              fi
            done

            orig_width=$(identify -format "%w" "$img" 2>/dev/null || echo 0)
            has_alpha="False"
            case "$img" in
              *.png|*.PNG)
                has_alpha=$(identify -format "%A" "$img" 2>/dev/null || echo "False")
                ;;
            esac

            for target_w in $WIDTHS; do
              out="assets/img-webp/${base}-${target_w}w.webp"
              mkdir -p "$(dirname "$out")"

              # Never upscale: if original is smaller than target, use original width.
              if [ "$orig_width" -le "$target_w" ]; then
                resize_args=""
              else
                resize_args="-resize $target_w 0"
              fi

              if [ "$has_alpha" = "True" ]; then
                cwebp -lossless $resize_args "$img" -o "$out" >/dev/null 2>&1
              else
                cwebp -q 82 $resize_args "$img" -o "$out" >/dev/null 2>&1
              fi

              before=$(stat -c%s "$img")
              after=$(stat -c%s "$out")
              echo "Converted: $img (${before}B) -> $out (${after}B) [${target_w}w]"
            done
          }

          find assets/img -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" \) | while read -r img; do
            convert_one "$img"
          done

      - name: Copy WebP into assets
        run: |
          if [ -d assets/img-webp ]; then
            cp -rn assets/img-webp/. assets/img/
          fi

      - name: Minify CSS
        run: |
          for f in assets/css/*.css; do
            [[ "$f" == *.min.css ]] && continue
            npx --yes clean-css-cli -o "${f%.css}.min.css" "$f"
            echo "Minified: $f -> ${f%.css}.min.css"
          done

      - name: Build site with JBake
        run: jbake -b . output

      - name: Rewrite img to picture with responsive WebP srcset
        run: |
          find output -name "*.html" -print0 | xargs -0 -I{} python3 - "{}" <<'PYEOF'
          import re, sys

          # Responsive breakpoints generated by the Convert step (px values).
          WIDTHS = [800, 1200]

          # sizes tells the browser how wide the image will actually render:
          #   - Viewport <= 768px (mobile): full viewport width
          #   - Wider: capped at 860px (post max-width) / ~877px (index col-md-9)
          SIZES = "(max-width: 768px) 100vw, 860px"

          path = sys.argv[1]
          with open(path, "r", encoding="utf-8") as f:
              html = f.read()

          # Rewrite <img src="*.jpg|*.png"> → <picture><source srcset webp><img></picture>
          # Runs on final HTML in output/ so the browser never downloads both formats.
          # Excluded: imagem-padrao.png (OG fallback — keep .png for crawler compat).
          # Note: regex-based for standard single-line <img> from JBake's MD parser.
          # Switch to BeautifulSoup if multiline img attributes ever appear.
          def replace_img(match):
              full_tag = match.group(0)
              src = match.group(1)

              if "imagem-padrao" in src:
                  return full_tag

              base = re.sub(r"\.(jpe?g|png)$", "", src, flags=re.IGNORECASE)

              # Build srcset from generated width variants.
              # If the original was smaller than a breakpoint, the CI script
              # keeps the original dimensions — both entries are still valid.
              srcset = ", ".join(f"{base}-{w}w.webp {w}w" for w in WIDTHS)

              return (
                  f'<picture>'
                  f'<source srcset="{srcset}" sizes="{SIZES}" type="image/webp">'
                  f'{full_tag}'
                  f'</picture>'
              )

          pattern = re.compile(r'<img\s+[^>]*src="([^"]+\.(jpe?g|png))"[^>]*>', re.IGNORECASE)
          new_html = pattern.sub(replace_img, html)

          if new_html != html:
              with open(path, "w", encoding="utf-8") as f:
                  f.write(new_html)
              print(f"Rewrote: {path}")
          PYEOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prevent Jekyll build
        run: touch ./output/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './output'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4