name: Deploy RPGZine to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install JBake
        run: |
          curl -sL https://github.com/jbake-org/jbake/releases/download/v2.7.0/jbake-2.7.0-bin.zip -o jbake.zip
          unzip -q jbake.zip
          chmod +x jbake-2.7.0-bin/bin/jbake
          echo "$PWD/jbake-2.7.0-bin/bin" >> $GITHUB_PATH

      - name: Build site with JBake
        run: jbake -b . output

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './output'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
